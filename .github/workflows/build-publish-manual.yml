name: Build and Publish (manual)

on:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: Build and publish the Docker image
        type: boolean
        default: false

jobs:
  test:
    uses: ./.github/workflows/dotnet-test.yml

  version:
    needs: test
    if: ${{ inputs.publish_docker }}
    uses: ./.github/workflows/version.yml
    with:
      bump: minor

  publish:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Create version tag
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        git tag "v$VERSION"
        git push origin "v$VERSION"
