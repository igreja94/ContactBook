name: .NET Docker Build (Manual)

on:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: Build and publish the Docker image
        type: boolean
        default: false

jobs:
  test:
    uses: ./.github/workflows/dotnet-test.yml

  publish:
    needs: test
    if: ${{ inputs.publish_docker }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      use-commit-sha-tag: true
