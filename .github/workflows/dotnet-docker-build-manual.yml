name: .NET Docker Build (Manual)

on:
  workflow_dispatch:

jobs:
  restore-build-test-dotnet:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./src/ContactBook.slnx
    - name: Build
      run: dotnet build ./src/ContactBook.slnx --no-restore
    - name: Test
      run: dotnet test ./src/ContactBook.slnx --no-build --verbosity normal

  build-publish-docker:
    needs: restore-build-test-dotnet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository name to lowercase
      id: lowercase_repo
      run: |
        repo_name="${{ github.repository }}"
        lowercase_repo_name=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')
        echo "Repository name in lowercase: $lowercase_repo_name"
        echo "::set-output name=repo::$lowercase_repo_name"

    - name: Set commit SHA tag
      id: commit_tag
      run: |
        SHORT_SHA=${GITHUB_SHA:0:7}  # Extract the first 7 characters of the commit SHA
        echo "Commit short SHA: $SHORT_SHA"
        echo "::set-output name=tag::$SHORT_SHA"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src
        file: ./src/Webhost/Dockerfile
        push: true
        tags: ghcr.io/${{ steps.lowercase_repo.outputs.repo }}:${{ steps.commit_tag.outputs.tag }}
