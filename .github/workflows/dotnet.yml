name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  restore:
    runs-on: ubuntu-latest
    outputs:
      restore-cache-hit: ${{ steps.cache.outputs.cache-hit }}  # Save the cache hit status
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages  # Path where NuGet packages are stored
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}  # Cache key based on project files
          restore-keys: |
            ${{ runner.os }}-dotnet-
      - name: Restore dependencies
        run: dotnet restore ./src/ContactBook.slnx

  build:
    runs-on: ubuntu-latest
    needs: restore  # Ensure restore job runs before build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-
      - name: Build
        run: dotnet build ./src/ContactBook.slnx --no-restore  # Skip restore as it is already done

  test:
    runs-on: ubuntu-latest
    needs: build  # Ensure build job runs before test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet packages
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-
      - name: Test
        run: dotnet test ./src/ContactBook.slnx --no-build --verbosity normal
