name: .NET - Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  restore-build-test-dotnet:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./src/ContactBook.slnx
    - name: Build
      run: dotnet build ./src/ContactBook.slnx --no-restore
    - name: Test
      run: dotnet test ./src/ContactBook.slnx --no-build --verbosity normal

  build-publish-docker:
    needs: restore-build-test-dotnet
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}

    - name: Get Latest Version Tag
      id: version_tag
      run: |
        # Get the latest tag (with 'v' prefix, e.g., v0.0.x)
        latest_tag=$(git tag --list | sort -V | tail -n 1)
        
        if [[ -z "$latest_tag" ]]; then
          # If no tag is found, default to v0.0.1
          version="v0.0.1"
        else
          # Ensure the tag has the 'v' prefix
          latest_tag=${latest_tag#v}
          
          # Split version components
          major=$(echo $latest_tag | cut -d. -f1)
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)
          
          # Increment the patch version for PRs or pushes
          patch=$((patch + 1))
          version="v${major}.${minor}.${patch}"
        fi

        echo "PR Versioning: Tagging with $version"
        echo "::set-output name=tag::$version"

    - name: Determine final version tag
      id: final_version_tag
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Main merge detected: Tagging with latest"
          echo "::set-output name=tag::latest"
        else
          echo "Using PR version tag"
          echo "::set-output name=tag::${{ steps.version_tag.outputs.tag }}"
        fi

    - name: Convert repository name to lowercase
      id: lowercase_repo
      run: |
        repo_name="${{ github.repository }}"
        lowercase_repo_name=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')
        echo "Repository name in lowercase: $lowercase_repo_name"
        echo "::set-output name=repo::$lowercase_repo_name"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src
        file: ./src/API/Dockerfile
        push: true
        tags: ghcr.io/${{ steps.lowercase_repo.outputs.repo }}:${{ steps.final_version_tag.outputs.tag }}
        labels: ${{ steps.meta.outputs.labels }}