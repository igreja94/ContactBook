name: .NET - Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  restore-build-test-dotnet:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./src/ContactBook.slnx
    - name: Build
      run: dotnet build ./src/ContactBook.slnx --no-restore
    - name: Test
      run: dotnet test ./src/ContactBook.slnx --no-build --verbosity normal

  jobs:
  build-publish-docker:
    needs: restore-build-test-dotnet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine Image Tag
      id: image_tag
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # For PRs, use pr-<pr_number>
          echo "Using PR number as tag"
          echo "::set-output name=tag::pr-${{ github.event.pull_request.number }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          # For pushes to main, use latest as tag
          echo "Using 'latest' as tag"
          echo "::set-output name=tag::latest"
        else
          echo "No matching condition"
          exit 1
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src
        file: ./src/API/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ steps.image_tag.outputs.tag }}