# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Test and Build .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

  restore:
    runs-on: ubuntu-latest
    needs: setup 
    steps:
      - uses: actions/checkout@v4 
      - name: Restore dependencies
        run: dotnet restore ./src/ContactBook.slnx

  build:
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - uses: actions/checkout@v4 
      - name: Build
        run: dotnet build ./src/ContactBook.slnx --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: dotnet test ./src/ContactBook.slnx --no-build --verbosity normal
