name: .NET Build and Test

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore ./src/ContactBook.slnx

    - name: Build
      run: dotnet build ./src/ContactBook.slnx --no-restore

    - name: Test
      run: >
        dotnet test ./src/ContactBook.slnx --no-build --verbosity normal
        --collect:"XPlat Code Coverage"
        --logger trx --logger GitHubActions
        --results-directory ./TestResults

    - name: Generate coverage report
      if: ${{ !cancelled() }}
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        reportgenerator \
          -reports:"TestResults/**/coverage.cobertura.xml" \
          -targetdir:coverage-report \
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub" \
          -assemblyfilters:"-*.Tests;-AppHost;-ServiceDefaults" \
          -classfilters:"-Infrastructure.Migrations.*"
        cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx
        retention-days: 14

    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
        retention-days: 14
