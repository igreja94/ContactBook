name: Compute Version

on:
  workflow_call:
    inputs:
      bump:
        description: major or minor
        type: string
        required: true
    outputs:
      version:
        description: Next version (X.Y)
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compute next version
      id: next
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        last=$(git tag --list 'v[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
        last=${last:-v0.0}
        IFS=. read -r major minor _ <<< "${last#v}"
        if [ "$BUMP" = "major" ]; then
          major=$((major + 1)); minor=0
        else
          minor=$((minor + 1))
        fi
        echo "version=$major.$minor" >> "$GITHUB_OUTPUT"
